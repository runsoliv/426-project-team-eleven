services:
  incident-report-service:
    build: ./incident-report-service
    environment:
      - RABBITMQ_HOST=rabbitmq
    ports:
      - "3001:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      retries: 5

  incident-ambassador:
    build: ./incident-ambassador
    ports:
      - "4000:4000"
    depends_on:
      incident-report-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: alerts
      RABBITMQ_DEFAULT_PASS: alerts
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-worker:
    build: ./notification-worker
    ports:
      - "3003:3000"
    environment:
      - RABBITMQ_HOST=rabbitmq
      # Failure-injection toggle, see docs/FAILURE_SCENARIOS.md. Override with
      # WORKER_DELAY_MODE=true docker compose up -d notification-worker
      - WORKER_DELAY_MODE=${WORKER_DELAY_MODE:-false}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      retries: 5

  official-alert-a:
    build: ./official-alert-service
    environment:
      - REPLICA_LABEL=official-alert-a
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      retries: 5

  official-alert-b:
    build: ./official-alert-service
    environment:
      - REPLICA_LABEL=official-alert-b
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      retries: 5

  caddy:
    image: caddy:2
    ports:
      - "3002:3002"
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    depends_on:
      official-alert-a:
        condition: service_healthy
      official-alert-b:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3002/health",
        ]
      interval: 5s
      retries: 5

configs:
  caddy_config:
    content: |
      :3002 {
        reverse_proxy official-alert-a:3000 official-alert-b:3000 {
          lb_policy round_robin
          health_uri /health
          health_interval 2s
        }
      }
